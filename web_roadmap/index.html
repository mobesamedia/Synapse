<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse · FreeMap</title><link rel="stylesheet" href="tool_nav.css"><link rel="stylesheet" href="roadmap.css"><link rel="stylesheet" href="icons.css"><script src="i18n.js"></script><script src="host_bridge.js"></script><link rel="stylesheet" href="workspace_ui.css"><script src="workspace_ui.js"></script><script src="workspace_images.js"></script><script src="workspace_links.js"></script></head><body>
<main id="roadmap-app">
<header class="document-bar"><div class="map-selector-container"><select id="map-select" aria-label="Select FreeMap"></select><button id="new-map">New</button></div><div class="map-switcher"><span id="save-status" role="status"></span><details id="document-menu"><summary aria-label="FreeMap menu">☰</summary><div class="popover"><button data-doc="rename">Rename</button><button data-doc="duplicate">Duplicate FreeMap</button><button data-doc="export">Export</button><button data-doc="import">Import</button><button data-doc="tutorial">FreeMap tutorial</button><button data-doc="delete">Delete FreeMap</button></div></details></div></header>
<section id="workspace" aria-label="FreeMap workspace" tabindex="0">
<svg id="scene" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="world"><g id="objects"></g><g id="selection"></g></g></svg>
<div id="empty-hint">Your next idea starts here.<small>Open “+” and drag a shape onto the workspace.</small></div>
<div id="tools" class="control-stack"><details id="add-menu"><summary title="Add element" aria-label="Add element">＋</summary><div class="popover"><div class="palette-heading">Shapes</div><div id="shape-palette"></div><div class="palette-heading insert-heading">Insert</div><button class="insert-action" id="add-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span>Icons</span></button><button class="insert-action" id="add-image" title="Images are resized and stored locally."><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-5 5 6"/></svg><span>Add image</span></button><button class="insert-action" data-add="text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v14M8 19h8"/></svg><span>Free text</span></button><button class="insert-action" data-mode="arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg><span>Free arrow</span></button></div></details><button data-mode="auto" title="Automatic (A): pan the canvas, select objects" aria-label="Automatic">A</button><button data-mode="select" title="Select (V)" aria-label="Select">↖</button><button data-mode="hand" title="Pan (H), hold Space" aria-label="Pan">✋</button></div><div id="history-tools"><button id="undo" title="Undo" aria-label="Undo">↩</button><button id="redo" title="Redo" aria-label="Redo">↪</button></div>
<div id="zoom-tools" class="control-stack"><button id="zoom-in" title="Enlarge">＋</button><button id="zoom-out" title="Reduce">−</button><button id="fit" title="Show entire FreeMap" aria-label="Show entire FreeMap">⛶</button><output id="zoom-label">100%</output></div>
<button id="center" title="Center FreeMap" aria-label="Center FreeMap">Center view</button>
<div id="object-toolbar" hidden></div>
<div id="text-toolbar" role="toolbar" aria-label="Text formatting" hidden>
<div class="text-format-row"><div class="format-segment"><button data-format="bold" title="Bold" aria-label="Bold" aria-pressed="false"><b>B</b></button><button data-format="italic" title="Italic" aria-label="Italic" aria-pressed="false"><i>I</i></button><button data-format="underline" title="Underline" aria-label="Underline" aria-pressed="false"><u>U</u></button><button data-format="strikeThrough" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button></div>
<select id="text-align" aria-label="Text alignment" title="Text alignment"><option value="justifyLeft">Align left</option><option value="justifyCenter">Align center</option><option value="justifyRight">Align right</option><option value="justifyFull">Justify</option></select></div>
<div class="text-format-row"><label class="size-control"><span>Size</span><input id="text-size" aria-label="Font size" type="number" min="8" max="96" value="20"></label><label class="color-control" title="Text color"><span>A</span><input id="text-color" aria-label="Text color" type="color" value="#303030"></label><label class="color-control highlight-control" title="Highlight"><span>A</span><input id="text-highlight" aria-label="Highlight" type="color" value="#fff09b"></label><button id="text-done">Done</button></div>
</div>
<div id="message" role="status" hidden></div>
</section></main><input type="file" id="import-file" accept="application/json,.json" hidden>
<dialog id="arrow-label-dialog" aria-labelledby="arrow-label-title">
<form id="arrow-label-form">
<header><h2 id="arrow-label-title">Arrow label</h2><button type="button" id="arrow-label-close" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<div class="arrow-label-preview" aria-hidden="true"><span id="arrow-label-preview-text"></span></div>
<label class="arrow-label-field" for="arrow-label-input">Text</label>
<input id="arrow-label-input" type="text" autocomplete="off" maxlength="2000">
<label class="arrow-label-size"><span>Font size</span><select id="arrow-label-size" aria-label="Font size"></select></label>
<footer><button type="button" id="arrow-label-cancel">Cancel</button><button type="submit" class="primary">Save</button></footer>
</form></dialog>

<script src="routing.js"></script><script src="tutorial.js"></script><script src="icons/catalog.js"></script><script src="icons.js"></script><script src="roadmap.js"></script><script src="tool_nav.js"></script></body></html>
