    <title>Pro MindMap Tool - Complete (Dark Mode & Optimized Learning)</title>
    <script>
      const tutorialPractice = new URLSearchParams(location.search).get('practice') === '1';
      if(tutorialPractice)window.workspaceText=text=>window.__WORKSPACE_I18N__?.[text]||text;
      const practiceMemory = new Map();
      const mindmapStorage = tutorialPractice ? {
        getItem: key => practiceMemory.get(key) ?? null,
        setItem: (key, value) => practiceMemory.set(key, String(value)),
        removeItem: key => practiceMemory.delete(key)
      } : {
        getItem: key => window.localStorage.getItem(key),
        setItem: (key, value) => window.localStorage.setItem(key, value),
        removeItem: key => window.localStorage.removeItem(key)
      };
      (function () {
        const root = document.documentElement;
        if (typeof window.__SYNAPSE_MM_DARK__==='boolean' ? window.__SYNAPSE_MM_DARK__ :
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        }
        // These values are injected at DocumentCreation, before the first
        // paint. The map therefore never renders once with the default blue.
        if (window.__SYNAPSE_MM_ACCENT__) {
          root.style.setProperty('--primary-color', window.__SYNAPSE_MM_ACCENT__);
          root.style.setProperty(
            '--primary-color-dark',
            window.__SYNAPSE_MM_ACCENT_PRESSED__ || window.__SYNAPSE_MM_ACCENT__
          );
        }

        const bootState = { layout: false, theme: false, revealing: false };
        const bootStartedAt = performance.now();

        function revealWhenReady() {
          if (!bootState.layout || !bootState.theme || bootState.revealing) return;
          bootState.revealing = true;
          // A short minimum duration prevents a distracting one-frame flash,
          // while the two frames ensure the final centering has been painted.
          const delay = Math.max(0, 420 - (performance.now() - bootStartedAt));
          setTimeout(function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                const overlay = document.getElementById('mindmap-loading-overlay');
                if (!overlay) return;
                overlay.classList.add('is-hidden');
                overlay.setAttribute('aria-hidden', 'true');
                setTimeout(function () { overlay.remove(); }, 220);
              });
            });
          }, delay);
        }

        window.__synapseMarkMindmapLayoutReady = function () {
          bootState.layout = true;
          revealWhenReady();
        };
        window.__synapseMarkMindmapThemeReady = function () {
          bootState.theme = true;
          revealWhenReady();
        };

        // Last-resort escape hatch: an initialization error must remain visible
        // instead of being hidden forever behind the loading cover.
        setTimeout(function () {
          bootState.layout = true;
          bootState.theme = true;
          revealWhenReady();
        }, 6000);
      })();
    </script>

    <script>
        function mm(key, fallback) {
            var t = window.__SYNAPSE_MM_I18N__ || {};
            return t[key] !== undefined ? t[key] : fallback;
        }
        /* ── Global error reporting & toasts ───────────────────────────────
           Standalone block: must work even if the main mind map script crashes.
           Shows a dismissible banner with the real traceback instead of
           silently leaving the UI half-initialized. */
        (function() {
            function ensureToastContainer() {
                var c = document.getElementById('mm-toast-container');
                if (!c) { c = document.createElement('div'); c.id = 'mm-toast-container'; document.body.appendChild(c); }
                return c;
            }
            window.__mmToast = function(message, type, durationMs) {
                try {
                    var t = document.createElement('div');
                    t.className = 'mm-toast ' + (type || 'info');
                    t.textContent = message;
                    ensureToastContainer().appendChild(t);
                    requestAnimationFrame(function() { t.classList.add('show'); });
                    setTimeout(function() {
                        t.classList.remove('show');
                        setTimeout(function() { t.remove(); }, 300);
                    }, durationMs || 6000);
                } catch (e) { /* toasts must never throw */ }
            };
            function ensureBanner() {
                var b = document.getElementById('mm-error-banner');
                if (b) return b;
                b = document.createElement('div');
                b.id = 'mm-error-banner';
                b.innerHTML = '<div class="mm-eb-title">' + mm('error_title', 'MindMap error') + '</div>'
                    + '<div class="mm-eb-msg"></div><pre></pre>'
                    + '<div class="mm-eb-actions">'
                    + '<button data-act="details">' + mm('error_show', 'Show details') + '</button>'
                    + '<button data-act="copy">' + mm('error_copy', 'Copy error') + '</button>'
                    + '<button data-act="dismiss">' + mm('error_dismiss', 'Dismiss') + '</button></div>';
                document.body.appendChild(b);
                b.addEventListener('click', function(e) {
                    var act = e.target && e.target.dataset && e.target.dataset.act;
                    if (act === 'dismiss') b.classList.remove('visible');
                    if (act === 'details') {
                        b.classList.toggle('expanded');
                        e.target.textContent = b.classList.contains('expanded') ? mm('error_hide', 'Hide details') : mm('error_show', 'Show details');
                    }
                    if (act === 'copy') {
                        var text = b.querySelector('.mm-eb-msg').textContent + '\n\n' + b.querySelector('pre').textContent;
                        try { navigator.clipboard.writeText(text); e.target.textContent = mm('error_copied', 'Copied!'); setTimeout(function(){ e.target.textContent = mm('error_copy', 'Copy error'); }, 2000); } catch (err) {}
                    }
                });
                return b;
            }
            window.__mmReportError = function(err, context) {
                try {
                    var msg = (err && err.message) ? err.message : String(err);
                    var stack = (err && err.stack) ? String(err.stack) : mm('error_no_stack', '(no stack trace available)');
                    console.error('[MindMap]' + (context ? ' [' + context + ']' : ''), err);
                    var b = ensureBanner();
                    b.querySelector('.mm-eb-msg').textContent =
                        (context ? context + ': ' : '') + msg
                        + ' — ' + mm('error_safe', 'Please keep this window open and export your changes. Send the error details to help.synapse.pro@gmail.com.');
                    b.querySelector('pre').textContent = stack;
                    b.classList.add('visible');
                } catch (e) { console.error('[MindMap] error while reporting error', e, err); }
            };
            window.addEventListener('error', function(e) {
                if (e.error && (e.error.message || e.error.stack)) { window.__mindmapFaulted=true; window.__mmReportError(e.error, mm('error_unexpected', 'Unexpected error')); }
                else console.warn('[MindMap] Background browser error:', e.message || e);
            });
            window.addEventListener('unhandledrejection', function(e) {
                if (e.reason && e.reason.synapseCritical === true) { window.__mindmapFaulted=true; window.__mmReportError(e.reason, mm('error_unexpected_async', 'Unexpected error (async)')); }
                else console.warn('[MindMap] Background task rejected:', e.reason);
                e.preventDefault();
            });
        })();
    </script>

        document.addEventListener('DOMContentLoaded', () => {
            document.title = mm('app_title', 'MindMap');
            const container = document.getElementById('mindmap-container');
            const viewport = document.getElementById('mindmap-viewport');
            const canvas = document.getElementById('mindmap-canvas');
            const ctx = canvas.getContext('2d');
            const mindmapSelect = document.getElementById('mindmap-select');
            const newMapBtn = document.getElementById('new-map-btn');
            const aiHelperBtn = document.getElementById('ai-helper-btn'); 
            const deleteMapBtn = document.getElementById('delete-map-btn');
            const importBtn = document.getElementById('import-btn');
            const exportBtn = document.getElementById('export-btn');
            const infoBtn = document.getElementById('info-btn');
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');
            
            let nodes = [];
            let activeMindmapId = null;

            let historyStack = [];
            let redoStack = [];

            function trimMindmapHistory() {
                if(window.workspaceTrimHistory){window.workspaceTrimHistory(historyStack,redoStack);return;}
                // Sandboxed file:// tutorial frames may block external scripts.
                // Keep the same memory limit without weakening storage isolation.
                let size=historyStack.concat(redoStack).reduce((sum,state)=>sum+state.length,0);
                while(historyStack.length+redoStack.length>50||size>8000000){const stack=historyStack.length>=redoStack.length?historyStack:redoStack;if(!stack.length)break;size-=stack.shift().length;}
            }
            function pushState() {
                historyStack.push(JSON.stringify(nodes));
                redoStack = [];
                trimMindmapHistory(); 
            }

            function undo() {
                if (historyStack.length === 0) return;
                redoStack.push(JSON.stringify(nodes));
                const state = JSON.parse(historyStack.pop());
                trimMindmapHistory();
                applyState(state);
            }

            function redo() {
                if (redoStack.length === 0) return;
                historyStack.push(JSON.stringify(nodes));
                const state = JSON.parse(redoStack.pop());
                trimMindmapHistory();
                applyState(state);
            }

            function applyState(state) {
                nodes = state;
                viewport.innerHTML = '';
                nodes.forEach(createNodeElement);
                drawLines();
                saveCurrentMindmap();
            }
            
            let volatileMindmaps = null;

            function getMindmaps() {
                // If persistent browser storage is temporarily unavailable, keep
                // operating on the newest in-memory collection. The Python-side
                // recovery file remains the durable copy across WebView reloads.
                if (volatileMindmaps) {
                    return JSON.parse(JSON.stringify(volatileMindmaps));
                }
                // Never let corrupted storage take the whole feature down.
                let raw = null;
                try { raw = mindmapStorage.getItem('mindmaps'); } catch (e) { window.__mmReportError(e, mm('storage_read_failed', 'Storage read failed')); return {}; }
                if (!raw) return {};
                let parsed;
                try { parsed = JSON.parse(raw); } catch (e) {
                    // Root storage is corrupt: quarantine the raw data instead of losing it.
                    try { mindmapStorage.setItem('mindmaps_corrupt_backup_' + Date.now(), raw); mindmapStorage.removeItem('mindmaps'); } catch (e2) {}
                    window.__mmToast(mm('storage_corrupt', 'Stored mind map data was corrupted and has been backed up. Starting fresh.'), 'error', 9000);
                    return {};
                }
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
                return parsed;
            }
            let mindmapSaveTimer = null;
            let lastMindmapSaveAt = (() => {
                try { return Number(mindmapStorage.getItem('mindmaps_saved_at')) || 0; }
                catch (e) { return 0; }
            })();

            function saveMindmaps(mindmaps, savedAt = Date.now()) {
                if(window.__mindmapFaulted){window.__mindmapSaveStatus?.("error");return false;}
                window.__mindmapSaveStatus?.("pending");
                try {
                    const serialized = JSON.stringify(mindmaps);
                    mindmapStorage.setItem('mindmaps', serialized);
                    // Verify the write. QtWebEngine normally throws on quota errors,
                    // but explicit verification also catches silent storage failure.
                    if (mindmapStorage.getItem('mindmaps') !== serialized) {
                        throw new Error('Stored data did not match the saved snapshot.');
                    }
                    volatileMindmaps = null;
                    lastMindmapSaveAt = Number(savedAt) || Date.now();
                    try { mindmapStorage.setItem('mindmaps_saved_at', String(lastMindmapSaveAt)); } catch (e) {}
                    window.__mindmapSaveStatus?.('saved');
                    return true;
                } catch (e) {
                    // Most likely QuotaExceededError (webview storage limit).
                    const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22);
                    window.__mmToast(isQuota
                        ? mm('storage_full', 'Could not save: browser storage is full. Export your maps as backup and delete unused maps.')
                        : mm('save_failed', 'Could not save mind maps: {error}').replace('{error}', (e && e.message ? e.message : e)), 'error', 9000);
                    // Preserve the attempted snapshot in memory. A later flush also
                    // mirrors it to the profile recovery file before WebView teardown.
                    try { volatileMindmaps = JSON.parse(JSON.stringify(mindmaps)); } catch (copyError) {}
                    window.__mindmapSaveStatus?.('error');
                    console.error('[MindMap] saveMindmaps failed', e);
                    return false;
                }
            }

            function syncNodeTextsFromDom() {
                nodes.forEach(node => {
                    const textArea = document.querySelector(`#node-${node.id} .node-textarea`);
                    if (textArea) node.text = textArea.value;
                });
            }

            function currentMindmapSnapshot() {
                syncNodeTextsFromDom();
                if (isHintEditMode) {
                    nodes.forEach(node => {
                        const hintInput = document.querySelector(`#node-${node.id} .node-hint-input`);
                        if (hintInput) node.hint = hintInput.value.trim();
                    });
                }
                const mindmaps = getMindmaps();
                if (activeMindmapId && mindmaps[activeMindmapId]) {
                    mindmaps[activeMindmapId].nodes = nodes;
                }
                return mindmaps;
            }

            function saveCurrentMindmap() {
                window.workspaceCheckSize?.(nodes, activeMindmapId);
                clearTimeout(mindmapSaveTimer);
                mindmapSaveTimer = null;
                if (!activeMindmapId) return true;
                return saveMindmaps(currentMindmapSnapshot());
            }

            function scheduleCurrentMindmapSave() {
                window.__mindmapSaveStatus?.("pending");
                clearTimeout(mindmapSaveTimer);
                mindmapSaveTimer = setTimeout(saveCurrentMindmap, 350);
            }

            window.__synapseFlushMindmap = function() {
                if(window.__mindmapFaulted)return {saved:false,snapshot:null};
                clearTimeout(mindmapSaveTimer);
                mindmapSaveTimer = null;
                const mindmaps = currentMindmapSnapshot();
                const savedAt = Date.now();
                const saved = saveMindmaps(mindmaps, savedAt);
                return { saved, savedAt, snapshot: JSON.stringify(mindmaps) };
            };

            window.__synapseRestoreMindmapRecovery = function(snapshotJson, savedAt, render = true) {
                const recoveryTime = Number(savedAt) || 0;
                let storedTime = 0;
                try { storedTime = Number(mindmapStorage.getItem('mindmaps_saved_at')) || 0; } catch (e) {}
                // An orphaned timestamp must not outweigh the only remaining
                // map collection (for example after browser storage was lost).
                if (!recoveryTime || (Object.keys(getMindmaps()).length > 0 && recoveryTime <= storedTime)) return false;
                let recovered;
                try { recovered = JSON.parse(snapshotJson); }
                catch (e) { window.__mmReportError(e, mm('recovery_invalid', 'Recovery data is invalid')); return false; }
                if (!recovered || typeof recovered !== 'object' || Array.isArray(recovered)) return false;
                const persisted = saveMindmaps(recovered, recoveryTime);
                if (!persisted) volatileMindmaps = recovered;
                if (!render) return true; // init() loads the selected map once.
                loadMindmapList();
                const ids = Object.keys(recovered);
                if (ids.length) {
                    const target = activeMindmapId && recovered[activeMindmapId] ? activeMindmapId : ids[0];
                    loadMindmap(target);
                }
                window.__mmToast(persisted
                    ? mm('recovery_restored', 'A newer mind map recovery copy was restored.')
                    : mm('recovery_memory', 'Your recovery copy is open in memory. Free browser storage or export it before closing.'),
                    persisted ? 'info' : 'warning', persisted ? 6000 : 10000);
                return true;
            };

            window.addEventListener('pagehide', () => window.__synapseFlushMindmap());
            window.addEventListener('beforeunload', () => window.__synapseFlushMindmap());
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') window.__synapseFlushMindmap();
            });

            /* ── Mind map validation & healing ──────────────────────────────
               Every map goes through sanitizeMindmap() before it is saved or
               rendered. Returns { ok:true, map, healed:[..] } with a normalized
               deep copy, or { ok:false, error } with a targeted message. */
            function sanitizeMindmap(input) {
                const healed = [];
                if (input === null || typeof input !== 'object' || Array.isArray(input)) {
                    return { ok: false, error: 'Expected a JSON object like { "name": "...", "nodes": [...] }, but got ' + (Array.isArray(input) ? 'an array' : typeof input) + '.' };
                }
                let data;
                try { data = JSON.parse(JSON.stringify(input)); } catch (e) {
                    return { ok: false, error: 'Data could not be copied: ' + e.message };
                }
                // Some AIs wrap the map in an extra key, e.g. { "mindmap": {...} }.
                if (!Array.isArray(data.nodes)) {
                    const wrapperKey = Object.keys(data).find(k => data[k] && typeof data[k] === 'object' && Array.isArray(data[k].nodes));
                    if (wrapperKey) { data = data[wrapperKey]; healed.push('unwrapped "' + wrapperKey + '"'); }
                }
                if (!Array.isArray(data.nodes)) {
                    return { ok: false, error: 'Missing "nodes" array. The JSON must contain "nodes": [ { "id": 1, "text": "...", "parent": null }, ... ].' };
                }
                // Keep only usable node objects.
                const rawCount = data.nodes.length;
                let nodesArr = data.nodes.filter(n => n && typeof n === 'object' && !Array.isArray(n));
                if (nodesArr.length < rawCount) healed.push('removed ' + (rawCount - nodesArr.length) + ' invalid node entries');
                if (nodesArr.length === 0) {
                    return { ok: false, error: 'The "nodes" array contains no valid node objects.' };
                }
                if(nodesArr.some(n=>n.ankiLinks!==undefined&&!window.workspaceValidLinks(n.ankiLinks)))return {ok:false,error:window.workspaceText('Invalid Anki link.')};
                // Normalize ids/parents: numeric strings → numbers, "null"/undefined parent → null.
                const normId = v => (typeof v === 'string' && v.trim() !== '' && !isNaN(v)) ? Number(v) : v;
                nodesArr.forEach(n => {
                    n.id = normId(n.id);
                    if (n.parent === undefined || n.parent === 'null' || n.parent === '') n.parent = null;
                    n.parent = n.parent === null ? null : normId(n.parent);
                });
                // Assign missing ids and de-duplicate ids.
                const seen = new Set();
                let nextId = nodesArr.reduce((m, n) => (typeof n.id === 'number' && isFinite(n.id)) ? Math.max(m, n.id) : m, 0);
                nodesArr.forEach(n => {
                    const validId = (typeof n.id === 'number' && isFinite(n.id)) || (typeof n.id === 'string' && n.id !== '');
                    if (!validId || seen.has(n.id)) { n.id = ++nextId; healed.push('reassigned a missing/duplicate node id'); }
                    seen.add(n.id);
                });
                // Ensure exactly one root.
                let roots = nodesArr.filter(n => n.parent === null);
                if (roots.length === 0) { nodesArr[0].parent = null; roots = [nodesArr[0]]; healed.push('no root node found — made the first node the root'); }
                const root = roots[0];
                if (roots.length > 1) { roots.slice(1).forEach(r => { r.parent = root.id; }); healed.push('multiple root nodes — attached extras to the first root'); }
                // Self-references and parents that don't exist → attach to root.
                const idSet = new Set(nodesArr.map(n => n.id));
                nodesArr.forEach(n => {
                    if (n.parent !== null && (n.parent === n.id || !idSet.has(n.parent))) { n.parent = root.id; healed.push('fixed a node pointing to a missing parent'); }
                });
                // Break parent cycles (would cause infinite recursion when rendering/learning).
                const childrenOf = new Map();
                nodesArr.forEach(n => { if (n.parent !== null) { if (!childrenOf.has(n.parent)) childrenOf.set(n.parent, []); childrenOf.get(n.parent).push(n); } });
                function reachable() {
                    const r = new Set([root.id]); const stack = [root.id];
                    while (stack.length) { (childrenOf.get(stack.pop()) || []).forEach(c => { if (!r.has(c.id)) { r.add(c.id); stack.push(c.id); } }); }
                    return r;
                }
                let reach = reachable(); let guard = 0;
                while (reach.size < nodesArr.length && guard++ <= nodesArr.length) {
                    const orphan = nodesArr.find(n => !reach.has(n.id));
                    const old = orphan.parent;
                    if (old !== null && childrenOf.has(old)) { const arr = childrenOf.get(old); const i = arr.indexOf(orphan); if (i !== -1) arr.splice(i, 1); }
                    orphan.parent = root.id;
                    if (!childrenOf.has(root.id)) childrenOf.set(root.id, []);
                    childrenOf.get(root.id).push(orphan);
                    healed.push('broke a circular parent reference');
                    reach = reachable();
                }
                // Normalize node fields without touching valid values (keeps look & features intact).
                let needsLayout = false;
                nodesArr.forEach(n => {
                    if (typeof n.text !== 'string') { n.text = (n.text === undefined || n.text === null) ? '' : String(n.text); }
                    if (typeof n.x !== 'number' || !isFinite(n.x) || typeof n.y !== 'number' || !isFinite(n.y)) needsLayout = true;
                    if (n.size !== undefined && !['small', 'medium', 'large'].includes(n.size)) delete n.size;
                    if (n.color !== undefined && typeof n.color !== 'string') delete n.color;
                    if(n.image&&!/^[a-f0-9]{64}\.(png|jpg)$/.test(n.image))delete n.image;
                    if(n.fill&&!['#ffffff','#e7f2ff','#e4f5e9','#fff4cc','#fbe4e4','#eee7fa','#fce8d5'].includes(n.fill))delete n.fill;
                    if(n.textColor&&!/^#[0-9a-f]{6}$/i.test(n.textColor))delete n.textColor;
                    if(n.fontSize)n.fontSize=Math.max(12,Math.min(40,Number(n.fontSize)||16));
                    n.bold=!!n.bold;n.italic=!!n.italic;
                    if (n.hint !== undefined && typeof n.hint !== 'string') delete n.hint;
                });
                const name = (typeof data.name === 'string' && data.name.trim()) ? data.name : mm('unnamed_map', 'Unnamed Map');
                if (name !== data.name) healed.push('added a default name');
                return { ok: true, map: { ...data, name: name, nodes: nodesArr }, healed: healed, needsLayout: needsLayout };
            }

            // AI answers often wrap JSON in markdown fences or add prose around it.
            function extractJsonText(text) {
                let t = (text || '').trim();
                const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
                if (fence) t = fence[1].trim();
                if (!t.startsWith('{')) {
                    const start = t.indexOf('{'); const end = t.lastIndexOf('}');
                    if (start !== -1 && end > start) t = t.slice(start, end + 1);
                }
                return t;
            }
            
            /* Startup self-healing: fix or quarantine corrupt maps so one bad
               import can never brick the whole feature again. */
            function healStoredMindmaps() {
                const mindmaps = getMindmaps();
                let changed = false; let quarantined = 0; let healedCount = 0;
                for (const id of Object.keys(mindmaps)) {
                    const res = sanitizeMindmap(mindmaps[id]);
                    if (!res.ok) {
                        try { mindmapStorage.setItem('mindmap_quarantine_' + id, JSON.stringify(mindmaps[id])); } catch (e) {}
                        delete mindmaps[id];
                        quarantined++; changed = true;
                    } else if (res.healed.length > 0) {
                        mindmaps[id] = res.map;
                        healedCount++; changed = true;
                    }
                }
                if (changed) saveMindmaps(mindmaps);
                if (quarantined > 0) window.__mmToast(mm('corrupt_removed_count', '{count} corrupted mind map(s) were removed so the tool works again. A backup was kept in storage.').replace('{count}', String(quarantined)), 'warning', 10000);
                else if (healedCount > 0) window.__mmToast(mm('repaired_count', '{count} mind map(s) had invalid data and were repaired automatically.').replace('{count}', String(healedCount)), 'info', 7000);
            }

            function autoLayoutNodes(nodes) {
                const root = nodes.find(n => n.parent === null);
                if (!root) return;
                const childrenMap = new Map();
                nodes.forEach(node => {
                    if (node.parent !== null) {
                        if (!childrenMap.has(node.parent)) childrenMap.set(node.parent, []);
                        childrenMap.get(node.parent).push(node);
                    }
                });
                const containerRect = container.getBoundingClientRect();
                const vSpacing = 100; const hSpacing = 180;
                const visited = new Set(); // guard against cycles → infinite recursion
                function positionNodes(node, x, y, level) {
                    if (visited.has(node.id)) return;
                    visited.add(node.id);
                    node.x = x; node.y = y;
                    const children = childrenMap.get(node.id) || [];
                    const totalWidth = (children.length - 1) * hSpacing;
                    let startX = x - totalWidth / 2;
                    children.forEach((child, index) => {
                        positionNodes(child, startX + index * hSpacing, y + vSpacing, level + 1);
                    });
                }
                positionNodes(root, containerRect.width / 2 - 75, 50, 0);
            }

            /* Shared, safe import path: parse → validate/heal → save → load.
               Nothing is written to storage before the data is proven valid,
               and a failed load rolls the import back completely. */
            function importMindmap(rawText, errorEl) {
                const showError = (msg) => {
                    if (errorEl) { errorEl.textContent = msg; errorEl.style.display = 'block'; }
                    else alert(msg);
                };
                if (!saveCurrentMindmap()) { showError(mm('import_save_failed', 'The current mind map could not be saved. Import was cancelled to protect your changes.')); return false; }
                if (!rawText || !rawText.trim()) { showError(mm('import_paste_first', 'Please paste your mind map JSON first.')); return false; }
                let data;
                try {
                    data = JSON.parse(extractJsonText(rawText));
                } catch (e) {
                    showError(mm('invalid_json', 'Invalid JSON: {error}. Make sure you copied the complete JSON object.').replace('{error}', e.message));
                    return false;
                }
                if(data.assets&&Object.keys(data.assets).length){showError(window.workspaceText('Images require Anki.'));return false;}
                const res = sanitizeMindmap(data);
                if (!res.ok) { showError(mm('invalid_map', 'This JSON is not a valid mind map: {error}').replace('{error}', res.error)); return false; }
                if (res.needsLayout) { try { autoLayoutNodes(res.map.nodes); } catch (e) { console.error('[MindMap] auto layout failed', e); } }
                const id = `map_${Date.now()}`;
                const mindmaps = getMindmaps();
                mindmaps[id] = res.map;
                if (!saveMindmaps(mindmaps)) { showError(mm('import_store_failed', 'The mind map is valid but could not be saved (storage full?).')); return false; }
                try {
                    loadMindmapList();
                    loadMindmap(id);
                } catch (e) {
                    // Roll back so a failed load can never leave a broken map behind.
                    const rollback = getMindmaps(); delete rollback[id]; saveMindmaps(rollback);
                    loadMindmapList();
                    showError(mm('import_load_failed', 'Import failed while loading the map: {error}').replace('{error}', (e && e.message ? e.message : e)));
                    window.__mmReportError(e, mm('import_map', 'Import'));
                    return false;
                }
                if (res.healed.length > 0) window.__mmToast(mm('import_repaired', 'Mind map imported. Some data was repaired automatically: {details}').replace('{details}', [...new Set(res.healed)].join('; ')), 'warning', 8000);
                return true;
            }

            function centerOnNode(nodeId, immediate = false) { const node = nodes.find(n => n.id === nodeId); if (!node || !node.width) return; const containerRect = container.getBoundingClientRect(); const targetX = (containerRect.width / 2) - (node.x + node.width / 2) * view.scale; const targetY = (containerRect.height / 2) - (node.y + node.height / 2) * view.scale; if (immediate) { view.x = targetX; view.y = targetY; updateView(); return; } const startX = view.x; const startY = view.y; const duration = 400; let startTime = null; function animate(currentTime) { if (!startTime) startTime = currentTime; const elapsed = currentTime - startTime; const progress = Math.min(elapsed / duration, 1); const ease = t => t<.5 ? 2*t*t : -1+(4-2*t)*t; view.x = startX + (targetX - startX) * ease(progress); view.y = startY + (targetY - startY) * ease(progress); updateView(); if (progress < 1) requestAnimationFrame(animate); } requestAnimationFrame(animate); }

                nodes.forEach(node => { if (node.parent !== null) { const parent = nodes.find(p => p.id === node.parent); if (parent && node.width && parent.width) { ctx.beginPath(); ctx.moveTo(parent.x + parent.width / 2, parent.y + parent.height / 2); ctx.lineTo(node.x + node.width / 2, node.y + node.height / 2); ctx.stroke(); } } }); 
                if (isCreatingNode) { const startNode = nodes.find(n => n.id === creationStartNodeId); if (startNode && startNode.width) { ctx.strokeStyle = primaryColor; ctx.setLineDash([6 / view.scale, 4 / view.scale]); ctx.beginPath(); ctx.moveTo(startNode.x + startNode.width / 2, startNode.y + startNode.height / 2); ctx.lineTo(creationLineEnd.x, creationLineEnd.y); ctx.stroke(); } } 
                ctx.restore(); 
            }

            // ---- Learning Options Modal ----
            function showLearningOptionsModal() {
                if (nodes.length < 2) return;
                document.querySelectorAll('#scope-options .learn-option-btn').forEach(b => b.classList.toggle('active', b.dataset.value === learnOptions.scope));
                document.querySelectorAll('#order-options .learn-option-btn').forEach(b => b.classList.toggle('active', b.dataset.value === learnOptions.order));
                document.querySelectorAll('#penalty-options .learn-option-btn').forEach(b => b.classList.toggle('active', b.dataset.value === learnOptions.penalty));
                document.getElementById('learning-options-overlay').classList.add('visible');
            }
            function hideLearningOptionsModal() {
                document.getElementById('learning-options-overlay').classList.remove('visible');
            }
            function setupLearningOptionButtons() {
                ['scope-options', 'order-options', 'penalty-options'].forEach(groupId => {
                    document.getElementById(groupId).querySelectorAll('.learn-option-btn').forEach(btn => {
                        btn.onclick = () => {
                            btn.closest('.learn-option-row').querySelectorAll('.learn-option-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            const key = groupId.replace('-options', '');
                            learnOptions[key] = btn.dataset.value;
                        };
                    });
                });
                document.getElementById('learn-options-cancel-btn').onclick = hideLearningOptionsModal;
                document.getElementById('learn-options-start-btn').onclick = () => {
                    hideLearningOptionsModal();
                    if (learnOptions.scope === 'select') {
                        enterNodeSelectionMode();
                    } else {
                        _doStartLearning(null);
                    }
                };
                document.getElementById('selection-start-btn').onclick = () => {
                    const selected = [...selectedForLearning]; // capture before clear
                    exitNodeSelectionMode();
                    _doStartLearning(selected);
                };
                document.getElementById('selection-cancel-btn').onclick = exitNodeSelectionMode;
            }

            // ---- Node Selection Mode ----
            let selDragStart = null;
            let isDragSelecting = false;

            function enterNodeSelectionMode() {
                isSelectionMode = true;
                selectedForLearning.clear();
                document.body.classList.add('selection-mode');
                document.getElementById('selection-panel').classList.add('visible');
                updateSelectionCount();
            }
            function exitNodeSelectionMode() {
                isSelectionMode = false;
                isDragSelecting = false;
                document.getElementById('selection-rect').style.display = 'none';
                document.body.classList.remove('selection-mode');
                document.getElementById('selection-panel').classList.remove('visible');
                document.querySelectorAll('.node.selected-for-learning').forEach(el => el.classList.remove('selected-for-learning'));
                selectedForLearning.clear();
            }

            function startSelectionDrag(e) {
                if (!isSelectionMode || e.target.closest('.node') || e.button !== 0) return;
                e.stopPropagation();
                const rect = container.getBoundingClientRect();
                selDragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                isDragSelecting = true;
                const selRect = document.getElementById('selection-rect');
                selRect.style.left = selDragStart.x + 'px';
                selRect.style.top = selDragStart.y + 'px';
                selRect.style.width = '0px';
                selRect.style.height = '0px';
                selRect.style.display = 'block';
            }
            function updateSelectionDrag(e) {
                if (!isDragSelecting) return;
                const rect = container.getBoundingClientRect();
                const cur = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                const x = Math.min(selDragStart.x, cur.x);
                const y = Math.min(selDragStart.y, cur.y);
                const selRect = document.getElementById('selection-rect');
                selRect.style.left = x + 'px';
                selRect.style.top = y + 'px';
                selRect.style.width = Math.abs(cur.x - selDragStart.x) + 'px';
                selRect.style.height = Math.abs(cur.y - selDragStart.y) + 'px';
            }
            function finishSelectionDrag(e) {
                if (!isDragSelecting) return;
                isDragSelecting = false;
                const selRect = document.getElementById('selection-rect');
                selRect.style.display = 'none';
                const rect = container.getBoundingClientRect();
                const cur = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                if (Math.abs(cur.x - selDragStart.x) < 5 && Math.abs(cur.y - selDragStart.y) < 5) return;
                // Convert screen rect to world coords
                const x1 = (Math.min(selDragStart.x, cur.x) - view.x) / view.scale;
                const y1 = (Math.min(selDragStart.y, cur.y) - view.y) / view.scale;
                const x2 = (Math.max(selDragStart.x, cur.x) - view.x) / view.scale;
                const y2 = (Math.max(selDragStart.y, cur.y) - view.y) / view.scale;
                nodes.forEach(node => {
                    const nw = node.width || 100;
                    const nh = node.height || 40;
                    if (node.x < x2 && node.x + nw > x1 && node.y < y2 && node.y + nh > y1) {
                        selectedForLearning.add(node.id);
                        document.getElementById(`node-${node.id}`)?.classList.add('selected-for-learning');
                    }
                });
                updateSelectionCount();
                selDragStart = null;
            }
            function updateSelectionCount() {
                document.getElementById('selection-count').textContent = mm('selected_count', '{count} selected').replace('{count}', String(selectedForLearning.size));
                document.getElementById('selection-start-btn').disabled = selectedForLearning.size === 0;
            }
            function handleSelectionModeClick(nodeId) {
                if (selectedForLearning.has(nodeId)) {
                    selectedForLearning.delete(nodeId);
                    document.getElementById(`node-${nodeId}`)?.classList.remove('selected-for-learning');
                } else {
                    selectedForLearning.add(nodeId);
                    document.getElementById(`node-${nodeId}`)?.classList.add('selected-for-learning');
                }
                updateSelectionCount();
            }

            // ---- Build flat DFS list ----
            function buildDFSList(filterIds) {
                const result = [];
                const rootNode = nodes.find(n => n.parent === null);
                if (!rootNode) return result;
                const visited = new Set(); // guard against cycles → infinite recursion
                function dfs(nodeId) {
                    if (visited.has(nodeId)) return;
                    visited.add(nodeId);
                    if (filterIds === null || filterIds.includes(nodeId)) result.push(nodeId);
                    nodes.filter(n => n.parent === nodeId).forEach(child => dfs(child.id));
                }
                dfs(rootNode.id);
                // Remove the root itself — it's always shown as context, never tested
                const idx = result.indexOf(rootNode.id);
                if (idx !== -1) result.splice(idx, 1);
                return result;
            }

            // ---- Start Learning ----
            function _doStartLearning(nodeIdList) {
                // Use DFS ordering to preserve tree structure; filter to selection if provided
                let queue = buildDFSList(nodeIdList);
                if (learnOptions.order === 'random') {
                    for (let i = queue.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [queue[i], queue[j]] = [queue[j], queue[i]];
                    }
                }
                if (queue.length === 0) return;
                learningQueue = queue;
                wrongQueue = [];
                currentLearningNode = null;
                isLearningMode = true;
                tutorialAction('learn');
                document.body.classList.add('learning-mode');
                learningUI.style.display = 'flex';
                document.querySelectorAll('.node .node-textarea').forEach(ta => ta.classList.add('node-text-hidden'));
                presentQuestion();
            }

            // ---- Present question ----
            function presentQuestion() {
                document.querySelectorAll('.node').forEach(el => el.classList.remove('learning-current', 'learning-target'));
                if (learningQueue.length === 0 && wrongQueue.length > 0) {
                    learningQueue = [...wrongQueue];
                    wrongQueue = [];
                    if (learnOptions.order === 'random') {
                        for (let i = learningQueue.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [learningQueue[i], learningQueue[j]] = [learningQueue[j], learningQueue[i]];
                        }
                    }
                    learningPrompt.textContent = '📋 ' + mm('review_missed', 'Reviewing missed cards…');
                    setTimeout(presentQuestion, 1100);
                    return;
                }
                if (learningQueue.length === 0) {
                    learningPrompt.textContent = '🎉 ' + mm('learning_done', 'Done! Great work!');
                    setTimeout(stopLearningMode, 2500);
                    return;
                }
                const nodeId = learningQueue[0];
                currentLearningNode = nodes.find(n => n.id === nodeId);
                if (!currentLearningNode) { learningQueue.shift(); presentQuestion(); return; }
                document.querySelectorAll('.node .node-textarea').forEach(ta => ta.classList.add('node-text-hidden'));
                const parentNode = nodes.find(n => n.id === currentLearningNode.parent);
                if (parentNode) {
                    const parentEl = document.getElementById(`node-${parentNode.id}`);
                    if (parentEl) { parentEl.classList.add('learning-current'); parentEl.querySelector('.node-textarea')?.classList.remove('node-text-hidden'); }
                }
                const targetEl = document.getElementById(`node-${nodeId}`);
                if (targetEl) { targetEl.classList.add('learning-target'); targetEl.querySelector('.node-textarea')?.classList.add('node-text-hidden'); centerOnNode(nodeId); }
                const remaining = learningQueue.length + wrongQueue.length;
                learningPrompt.textContent = mm('recall_prompt', 'Recall the highlighted node · {remaining} remaining').replace('{remaining}', String(remaining));
                const hintEl = document.getElementById('learning-hint');
                if (currentLearningNode.hint) {
                    hintEl.textContent = '💡 ' + currentLearningNode.hint;
                    hintEl.style.opacity = '1';
                } else {
                    hintEl.textContent = '';
                    hintEl.style.opacity = '0';
                }
                stageGuess.style.display = 'block';
                stageEvaluate.style.display = 'none';
            }

            function revealAnswer() {
                if (!currentLearningNode) return;
                document.getElementById(`node-${currentLearningNode.id}`)?.querySelector('.node-textarea')?.classList.remove('node-text-hidden');
                centerOnNode(currentLearningNode.id);
                learningPrompt.textContent = mm('recall_correct', 'Did you recall it correctly?');
                const hintEl = document.getElementById('learning-hint');
                hintEl.textContent = '';
                hintEl.style.opacity = '0';
                stageGuess.style.display = 'none';
                stageEvaluate.style.display = 'flex';
            }
            function handleAnswer(wasCorrect) {
                if (!currentLearningNode) return;
                const nodeId = learningQueue.shift();
                if (!wasCorrect) {
                    if (learnOptions.penalty === 'soon') {
                        learningQueue.splice(Math.min(3, learningQueue.length), 0, nodeId);
                    } else if (learnOptions.penalty === 'later') {
                        wrongQueue.push(nodeId);
                    }
                    // 'none' → just skip
                }
                presentQuestion();
            }
            function stopLearningMode() {
                isLearningMode = false; learningQueue = []; wrongQueue = []; currentLearningNode = null;
                document.body.classList.remove('learning-mode');
                learningUI.style.display = 'none';
                document.querySelectorAll('.node').forEach(el => {
                    el.classList.remove('learning-current', 'learning-target');
                    el.querySelector('.node-textarea')?.classList.remove('node-text-hidden');
                });
                centerOnRootNode();
            }

            // The parent map remains mounted. Practice runs in a sandboxed frame
            // with its own in-memory storage adapter, never the user's store.
            let practiceDialog = null;
            let tutorialStep = 0;
            const tutorialCompleted = new Set();
            const tutorialSteps = [
                ['edit', 'tour_edit', 'Click the main topic and change its text.', '#node-1'],
                ['child', 'tour_child', 'Drag the small blue dot on the main topic into an empty area to create a child node.', '#node-1 .drag-handle'],
                ['style', 'tour_style', 'Right click a node and choose a different color or size.', '#node-1'],
                ['navigate', 'tour_navigate', 'Drag the empty canvas to move the view. Use the mouse wheel or the zoom buttons to zoom.', '.zoom-controls'],
                ['fit', 'tour_fit', 'Click Show entire map to bring every node into view. Node positions stay unchanged.', '#fit-map-btn'],
                ['learn', 'tour_learn', 'Open the highlighted menu and choose Start Learning. Try revealing a hidden answer.', '#hamburger-btn']
            ];
            function tutorialAction(action) {
                if (!tutorialPractice || action !== tutorialSteps[tutorialStep][0]) return;
                tutorialCompleted.add(tutorialStep);
                updateTutorialProgress();
            }
            function updateTutorialProgress() {
                const done = tutorialCompleted.has(tutorialStep);
                document.getElementById('tour-status').textContent = done ? mm('tour_done', 'Done. Continue when you are ready.') : '';
                const next = document.getElementById('tour-next');
                next.textContent = tutorialStep === tutorialSteps.length - 1 ? mm('tour_finish','Finish tutorial') : done ? mm('tour_next','Next') : mm('tour_skip','Skip step');
                next.classList.toggle('tour-complete', done);
                document.getElementById('tour-progress').value = tutorialStep + (done ? 1 : 0);
            }
            function renderTutorialStep() {
                document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
                const step = tutorialSteps[tutorialStep];
                document.getElementById('tour-heading').textContent = mm('tour_step','Step {current} of {total}').replace('{current}',tutorialStep + 1).replace('{total}',tutorialSteps.length);
                const progress = document.getElementById('tour-progress');
                progress.max = tutorialSteps.length;
                progress.setAttribute('aria-label', document.getElementById('tour-heading').textContent);
                document.getElementById('tour-text').textContent = mm(step[1],step[2]);
                document.getElementById('tour-back').textContent = mm('tour_back','Back');
                document.getElementById('tour-back').disabled = tutorialStep === 0;
                document.querySelector(step[3])?.classList.add('tour-highlight');
                if (tutorialStep < 3) fitEntireMap();
                document.getElementById('hamburger-dropdown').classList.remove('open');
                hideContextMenu();
                updateTutorialProgress();
            }
            function initializePractice() {
                document.body.classList.add('tutorial-practice');
                const guide = document.createElement('section'); guide.id='tour-guide';
                guide.innerHTML='<strong id="tour-heading"></strong><progress id="tour-progress" value="0" max="6"></progress><p id="tour-text"></p><div id="tour-status" role="status"></div><div class="tour-actions"><button class="button" id="tour-back"></button><button class="button primary" id="tour-next"></button></div>';
                document.body.insertBefore(guide, document.querySelector('.header'));
                const changeStep = delta => {
                    if (isLearningMode) stopLearningMode();
                    if (isSelectionMode) exitNodeSelectionMode();
                    hideLearningOptionsModal();
                    tutorialStep=Math.max(0,Math.min(tutorialSteps.length - 1,tutorialStep+delta));
                    renderTutorialStep();
                };
                document.getElementById('tour-back').onclick=()=>changeStep(-1);
                document.getElementById('tour-next').onclick=()=>{
                    if(tutorialStep===tutorialSteps.length - 1) parent.postMessage({type:'synapse-tour-close'}, '*');
                    else changeStep(1);
                };
                const sample={name:'Practice',nodes:[
                    {id:1,text:mm('tour_topic','My learning topic'),parent:null,x:0,y:0,color:'#0071d3',size:'medium'},
                    {id:2,text:mm('tour_example','An example'),parent:1,x:220,y:140,color:'#0071d3',size:'medium'}
                ]};
                saveMindmaps({practice:sample}); loadMindmap('practice');
                setTimeout(()=>{fitEntireMap();renderTutorialStep();}, 80);
                window.__synapseMarkMindmapThemeReady?.();
                window.addEventListener('message', event=>{
                    if(event.source!==parent || event.data?.type!=='synapse-tour-init') return;
                    window.__SYNAPSE_MM_I18N__=event.data.i18n || {};
                    window.__WORKSPACE_I18N__=event.data.workspaceI18n||{};
                    document.documentElement.classList.toggle('dark',!!event.data.dark);
                    if(event.data.accent) document.documentElement.style.setProperty('--primary-color',event.data.accent);
                    window.applyMindmapI18n?.();
                    // Translate untouched sample labels only; never undo an exercise edit.
                    nodes.forEach(node => {
                        const key = node.text === 'My learning topic' ? 'tour_topic' : node.text === 'An example' ? 'tour_example' : null;
                        if (!key) return;
                        node.text = mm(key, node.text);
                        const input = document.querySelector(`#node-${node.id} .node-textarea`);
                        if (input) { input.value=node.text; input.dispatchEvent(new Event('input')); }
                    });
                    document.getElementById('fit-map-btn').setAttribute('aria-label',mm('fit_map','Show entire map'));
                    renderTutorialStep();
                });
            }
            function openPractice() {
                if(tutorialPractice || practiceDialog) return;
                if(isLearningMode || isHintEditMode || isSelectionMode || isCreatingNode) {
                    window.__mmToast(mm('tour_busy','Finish the current editing or learning mode before opening the tutorial.'),'info'); return;
                }
                const dialog=document.createElement('dialog'); dialog.className='tour-dialog';
                dialog.setAttribute('aria-label',mm('tutorial','Tutorial'));
                const bar=document.createElement('div'); bar.className='tour-dialog-bar';
                const title=document.createElement('strong');title.textContent=mm('tutorial','Tutorial');
                const close=document.createElement('button');close.className='button';close.textContent=mm('tour_exit','Exit tutorial');
                bar.append(title,close);
                const frame=document.createElement('iframe');frame.title=mm('tutorial','Tutorial');
                frame.setAttribute('sandbox','allow-scripts allow-modals');
                const url=new URL(location.href);url.search='?practice=1';url.hash='';frame.src=url.href;
                const receive=event=>{if(event.source===frame.contentWindow && event.data?.type==='synapse-tour-close') dialog.close();};
                frame.onload=()=>frame.contentWindow.postMessage({type:'synapse-tour-init',i18n:window.__SYNAPSE_MM_I18N__,workspaceI18n:window.__WORKSPACE_I18N__,dark:document.documentElement.classList.contains('dark'),accent:getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim()},'*');
                close.onclick=()=>dialog.close();
                dialog.addEventListener('close',()=>{window.removeEventListener('message',receive);frame.remove();dialog.remove();practiceDialog=null;document.getElementById('hamburger-btn').focus();},{once:true});
                window.addEventListener('message',receive);dialog.append(bar,frame);document.body.append(dialog);practiceDialog=dialog;dialog.showModal();close.focus();
            }
            window.__synapseOfferTutorial = function() {
                if(tutorialPractice || practiceDialog || document.querySelector('.tour-invitation')) return;
                const dialog=document.createElement('dialog');dialog.className='tour-invitation';dialog.setAttribute('aria-labelledby','tour-intro-title');
                const title=document.createElement('h2');title.id='tour-intro-title';title.textContent=mm('tour_invite','Discover Mindmaps');
                const text=document.createElement('p');text.className='tour-intro-summary';text.textContent=mm('tour_intro_summary','Connect ideas visually and test your knowledge with hidden answers.');
                const steps=document.createElement('section');steps.className='tour-intro-steps';
                const heading=document.createElement('h3');heading.textContent=mm('tour_intro_steps','Six short steps');
                const list=document.createElement('ul');
                [['tour_intro_create','Create and connect nodes'],['tour_intro_style','Adjust colors and sizes'],['tour_intro_navigate','Navigate your map and try learning mode']].forEach(([key,fallback])=>{
                    const item=document.createElement('li');item.textContent=mm(key,fallback);list.append(item);
                });
                steps.append(heading,list);
                const note=document.createElement('section');note.className='tour-intro-note';
                const noteTitle=document.createElement('h3');noteTitle.textContent=mm('tour_intro_safe_title','Practice with sample data');
                const noteText=document.createElement('p');noteText.textContent=mm('tour_intro_safe','Your own maps stay untouched. Practice changes are not saved.');
                note.append(noteTitle,noteText);
                const exitHint=document.createElement('p');exitHint.className='tour-intro-exit';exitHint.textContent=mm('tour_intro_exit','You can exit at any time and restart from the menu.');
                const yes=document.createElement('button');yes.className='button primary';yes.textContent=mm('tour_start','Start tutorial');
                const no=document.createElement('button');no.className='button';no.textContent=mm('tour_not_now','Not now');
                yes.onclick=()=>{dialog.close();openPractice();};no.onclick=()=>dialog.close();
                dialog.addEventListener('close',()=>dialog.remove(),{once:true});const actions=document.createElement('div');actions.className='tour-actions';actions.append(no,yes);dialog.append(title,text,steps,note,exitHint,actions);document.body.append(dialog);dialog.showModal();no.focus();
            };

            try {
                init();
            } catch (e) {
                // Last line of defense: report the error AND still wire up the UI,
                // so the buttons can never end up dead again.
                window.__mmReportError(e, mm('initialization', 'Initialization'));
                try { setupEventListeners(); } catch (e2) { console.error('[MindMap]', e2); }
                try { setupLearningOptionButtons(); } catch (e2) { console.error('[MindMap]', e2); }
                if (window.__synapseMarkMindmapLayoutReady) {
                    window.__synapseMarkMindmapLayoutReady();
                }
            }
        });
    </script>

    <script>
        /* ── Fullscreen toggle ─────────────────────────────────────────── */
        window.__mindmapFs = false;

        var _FS_SVG_EXPAND = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
        var _FS_SVG_COLLAPSE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="10" y1="14" x2="3" y2="21"></line><line x1="21" y1="3" x2="14" y2="10"></line></svg>';

        var _WIN_SVG_CLOSE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>';

        }

        /* ── i18n ──────────────────────────────────────────────────────── */
        window.__SYNAPSE_MM_I18N__ = window.__SYNAPSE_MM_I18N__ || null;

        function applyMindmapI18n() {
            var t = window.__SYNAPSE_MM_I18N__;
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-title');
                if (t[key] !== undefined) { el.title = t[key]; if (el.id === 'fit-map-btn') el.setAttribute('aria-label', t[key]); }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-placeholder');
                if (t[key] !== undefined) el.placeholder = t[key];
            });
            var selectionCount = document.getElementById('selection-count');
            if (selectionCount && t.selected_count) {
                var count = (selectionCount.textContent.match(/\d+/) || ['0'])[0];
                selectionCount.textContent = t.selected_count.replace('{count}', count);
            }
        }
    </script>
