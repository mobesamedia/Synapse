<!DOCTYPE html>
<html lang="en">
<head>
<style id="sp-dark-scrollbars">
  /* Dark-mode scrollbars: Chromium styles native scrollbars from the
     color-scheme property, which otherwise stays "light".
     Theme comes from Anki (nightMode class injected by notebook_sidebar.py),
     NOT from prefers-color-scheme — that follows the OS, not Anki. */
  html.nightMode { color-scheme: dark; }
  html:has(body.nightMode) { color-scheme: dark; }
</style>

  <meta charset="UTF-8">
  <title>Todo</title>
  <style>
    :root {
      --bg:          #ffffff;
      --header-bg:   #f2f2f2;
      --sidebar-bg:  #f7f7f5;
      --text:        #37352f;
      --text-gray:   #9b9a97;
      --hover-bg:    #efefef;
      --border:      rgba(0,0,0,0.08);
      --font:        -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --accent:      var(--synapse-primary, #0071D3);
      --done-text:   #9b9a97;
      --tag-bg:      color-mix(in srgb, var(--accent) 14%, var(--card-bg));
      --tag-text:    var(--accent);
      --danger:      #e03e3e;
      --check-border:#c0c0bc;
      --check-done:  var(--accent);
      --input-bg:    #f7f7f5;
      --card-bg:     #ffffff;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    /* (OS-based prefers-color-scheme fallback removed — the theme is driven
       solely by Anki via the nightMode class, see body.nightMode below.) */
    body.nightMode {
      --bg:         #2c2c2c;
      --header-bg:  #252525;
      --sidebar-bg: #252525;
      --text:       #ffffff;
      --text-gray:  #b0b0b0;
      --hover-bg:   #414141;
      --border:     rgba(255,255,255,0.09);
      --accent:     var(--synapse-primary, #4a9eff);
      --done-text:  #7e7e7e;
      --tag-bg:     color-mix(in srgb, var(--accent) 14%, var(--card-bg));
      --tag-text:   var(--accent);
      --danger:     #e05a5a;
      --check-border:#7e7e7e;
      --check-done: var(--accent);
      --input-bg:   #414141;
      --card-bg:    #252525;
      --card-shadow:0 1px 3px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Tool header ────────────────────────── */
    #todo-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #todo-header h2 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      color: var(--text);
    }
    .filter-btn {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text-gray);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .filter-btn:hover:not(.active) {
      background: var(--hover-bg);
      color: var(--text);
    }

    /* ── Input area ─────────────────────────── */
    #add-area {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    #add-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #new-todo-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      transition: border-color 0.15s;
    }
    #new-todo-input:focus {
      border-color: var(--accent);
    }
    #new-todo-input::placeholder { color: var(--text-gray); }
    #add-btn {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    #add-btn:hover { opacity: 0.88; }
    #tag-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    #tag-input {
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 12px;
      font-family: var(--font);
      width: 130px;
    }
    #tag-input::placeholder { color: var(--text-gray); }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .tag-chip.selected { outline: 2px solid var(--accent); }
    .tag-chip-x { font-size: 10px; opacity: 0.7; }

    /* ── List area ──────────────────────────── */
    #todo-list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 16px 20px;
    }
    #todo-list-wrap::-webkit-scrollbar { width: 6px; }
    #todo-list-wrap::-webkit-scrollbar-track { background: transparent; }
    #todo-list-wrap::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #section-open, #section-done {
      margin-bottom: 10px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .section-label .count-badge {
      background: var(--hover-bg);
      border-radius: 10px;
      padding: 0 6px;
      font-size: 10px;
      color: var(--text-gray);
    }
    .section-toggle-icon { font-size: 9px; transition: transform 0.2s; }
    .section-label.collapsed .section-toggle-icon { transform: rotate(-90deg); }

    /* ── Todo item ──────────────────────────── */
    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      transition: background 0.12s;
      cursor: default;
      group: todo-item;
    }
    .todo-item:hover { background: var(--hover-bg); }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--done-text); }

    /* Custom checkbox */
    .todo-check {
      padding: 0;
      background: transparent;
      width: 18px;
      height: 18px;
      border: 2px solid var(--check-border);
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      margin-top: 1px;
    }
    .todo-item.done .todo-check {
      background: var(--check-done);
      border-color: var(--check-done);
    }
    .todo-check svg { display: none; }
    .todo-item.done .todo-check svg { display: block; }

    .todo-body { flex: 1; min-width: 0; }
    .todo-text {
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .todo-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .todo-date { font-size: 11px; color: var(--text-gray); }
    .item-tag {
      display: inline-block;
      padding: 1px 7px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    .todo-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .todo-item:hover .todo-actions, .todo-item:focus-within .todo-actions { opacity: 1; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .action-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-gray);
      transition: background 0.12s, color 0.12s;
      padding: 0;
    }
    .action-btn:hover { background: var(--hover-bg); }
    .action-btn.del:hover { color: var(--danger); }
    .action-btn svg { width: 14px; height: 14px; }

    /* ── Empty state ────────────────────────── */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      color: var(--text-gray);
      text-align: center;
      gap: 10px;
    }
    #empty-state svg { width: 40px; height: 40px; opacity: 0.35; }
    #empty-state p { font-size: 14px; }

    /* ── Status bar ─────────────────────────── */
    #status-bar {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 999;
    }
    #status-bar.show { opacity: 1; }

    /* ── Progress bar ───────────────────────── */
    #progress-wrap {
      padding: 0 16px 10px;
      flex-shrink: 0;
    }
    #progress-bar-bg {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }
    #progress-label {
      font-size: 11px;
      color: var(--text-gray);
      margin-top: 4px;
      text-align: right;
    }
  </style>
<style>
#task-footer{position:relative;flex-shrink:0;border-top:1px solid var(--border);background:var(--header-bg);}
.task-options{margin:0;padding:12px 16px;font-size:12px;color:var(--text);max-height:35vh;overflow:auto;}
.task-options summary{cursor:pointer;font-weight:500;}
#tag-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
#tag-input,#new-repeat{box-sizing:border-box;width:100%;min-width:0;height:32px;margin:0;padding:5px 9px;font-size:12px;line-height:20px;}
#new-repeat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:6px;}
#new-repeat:hover{border-color:var(--accent);}
#tag-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:2px;max-height:100px;overflow-y:auto;}
#tag-chips:empty{display:none;}
.tag-chip{max-width:100%;overflow-wrap:anywhere;flex-shrink:0;}
.task-options label{display:flex;gap:6px;align-items:flex-start;margin-top:10px;}.task-options p{line-height:1.5;}
#repeat-dialog{margin:auto;box-sizing:border-box;width:350px;max-width:calc(100vw - 24px);border:1px solid var(--border);border-radius:10px;padding:20px;color:var(--text);background:var(--bg);}
#repeat-dialog h3{margin:0 0 12px;font-size:17px;}
#repeat-dialog select{width:100%;padding:8px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:6px;}
#repeat-days{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}#repeat-days label{display:flex;align-items:center;gap:4px;font-size:12px;}
.repeat-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}.repeat-actions button{padding:6px 12px;border:1px solid var(--border);border-radius:6px;color:inherit;background:var(--bg);box-shadow:none;cursor:pointer;}
#repeat-note{margin-top:12px;font-size:12px;line-height:1.5;}.repeat-badge{color:var(--accent);font-size:11px;}.repeat-edit{font-size:18px;}
</style>
<style id="synapse-keyboard-focus">
body button:focus-visible, body input:focus-visible, body select:focus-visible,
body textarea:focus-visible, body a[href]:focus-visible, body [tabindex]:focus-visible {
  outline: 2px solid var(--accent, var(--primary-color, #0071d3));
  outline-offset: 2px;
}
</style>
<script src="task_schedule.js"></script>
</head>
<body>

<!-- header -->
<div id="todo-header">
  <h2 data-i18n="title">Todo</h2>
  <button class="filter-btn active" data-filter="all"    onclick="setFilter('all')"  data-i18n="filter_all">All</button>
  <button class="filter-btn"        data-filter="open"   onclick="setFilter('open')" data-i18n="filter_open">Open</button>
  <button class="filter-btn"        data-filter="done"   onclick="setFilter('done')" data-i18n="filter_done">Done</button>
</div>

<!-- add area -->
<div id="add-area">
  <div id="add-row">
    <input id="new-todo-input" type="text" placeholder="Add a task…" autocomplete="off"
           data-i18n-placeholder="add_placeholder"
           onkeydown="if(event.key==='Enter') addTodo()">
    <button id="add-btn" onclick="addTodo()" data-i18n="add_btn">+ Add</button>
  </div>
  <div id="tag-row">
    <input id="tag-input" type="text" placeholder="Tag (optional)" autocomplete="off"
           data-i18n-placeholder="tag_placeholder"
           onkeydown="if(event.key==='Enter') addTodo()">
    <button class="filter-btn" id="new-repeat" onclick="editRepeat(null)" data-i18n="repeat_title">Repeat task</button>
  </div>
  <div id="tag-chips"></div>
</div>


<dialog id="repeat-dialog"><h3 data-i18n="repeat_title">Repeat task</h3><select id="repeat-mode" onchange="showRepeatDays()">
<option value="none" data-i18n="repeat_none">No repeat</option><option value="daily" data-i18n="repeat_daily">Daily</option><option value="weekly" data-i18n="repeat_weekly">Weekly</option><option value="weekdays" data-i18n="repeat_days">Selected weekdays</option></select>
<div id="repeat-days"></div><p id="repeat-note"></p><div class="repeat-actions"><button onclick="document.getElementById('repeat-dialog').close()" data-i18n="cancel">Cancel</button><button onclick="applyRepeat()" data-i18n="save_repeat">Save</button></div></dialog>
<!-- progress -->
<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  <div id="progress-label">0 / 0 done</div>
</div>

<!-- list -->
<div id="todo-list-wrap">
  <div id="section-open">
    <div class="section-label" role="button" tabindex="0" aria-expanded="true" onclick="toggleSection('open')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();this.click();}">
      <span class="section-toggle-icon">▾</span>
      <span data-i18n="section_open">Open</span>
      <span class="count-badge" id="open-count">0</span>
    </div>
    <div id="open-list"></div>
  </div>
  <div id="section-done">
    <div class="section-label" role="button" tabindex="0" aria-expanded="true" onclick="toggleSection('done')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();this.click();}">
      <span class="section-toggle-icon">▾</span>
      <span data-i18n="section_done">Done</span>
      <span class="count-badge" id="done-count">0</span>
    </div>
    <div id="done-list"></div>
  </div>
  <div id="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="9 11 12 14 22 4"/>
      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
    <p><span data-i18n="empty">No tasks yet.</span><br><span data-i18n="empty_sub">Add one above!</span></p>
  </div>
</div>

<footer id="task-footer">
<details class="task-options"><summary data-i18n="task_options">Task settings</summary>
<label><input id="auto-cleanup" type="checkbox" onchange="setCleanup(this.checked)"> <span data-i18n="auto_cleanup">Remove completed one-time tasks on the next day</span></label>
<p data-i18n="cleanup_note">Off by default. Recurring tasks and old tasks without a completion date are kept.</p></details>
<div id="status-bar" data-i18n="saved">Saved</div>
</footer>

<script>
// ── State ─────────────────────────────────────────
let todos  = [];   // [{id, text, done, tag, createdAt}]
let filter = "all";
let autoCleanup = !!window.__SYNAPSE_TODO_AUTO_CLEANUP__;
let draftRepeat = {repeat:'none'};
let repeatTarget = null;
const trTask = (key,fallback) => window.__SYNAPSE_I18N__?.[key] || fallback;
function recurrenceLabel(t) {
  if(!['daily','weekly','weekdays'].includes(t.repeat))return '';
  let text=trTask('repeat_'+(t.repeat==='weekdays'?'days':t.repeat),{daily:'Daily',weekly:'Weekly',weekdays:'Selected weekdays'}[t.repeat]);
  if(t.repeat==='weekdays')text+=': '+(t.repeat_days||[]).map(d=>new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(new Date(2024,0,7+d))).join(', ');
  if(t.due_on && t.due_on>TaskSchedule.today())text+=' · '+t.due_on;
  return text;
}
function editRepeat(id) {
  repeatTarget=id;
  const t=id===null?draftRepeat:todos.find(t=>t.id===id);
  if(!t)return;
  document.getElementById('repeat-mode').value=t.repeat||'none';
  document.getElementById('repeat-days').innerHTML=Array.from({length:7},(_,i)=>{const day=(i+1)%7;const name=new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(new Date(2024,0,7+day));return `<label><input type="checkbox" value="${day}" ${(t.repeat_days||[new Date().getDay()]).includes(day)?'checked':''}>${esc(name)}</label>`;}).join('');
  showRepeatDays();document.getElementById('repeat-dialog').showModal();
}
function showRepeatDays(){document.getElementById('repeat-days').style.display=document.getElementById('repeat-mode').value==='weekdays'?'flex':'none';document.getElementById('repeat-note').textContent=trTask('repeat_note','Weekly tasks repeat on the weekday you configure them. Missed tasks remain open without extra copies.');}
function applyRepeat(){
  const mode=document.getElementById('repeat-mode').value;
  const days=[...document.querySelectorAll('#repeat-days input:checked')].map(e=>Number(e.value));
  if(mode==='weekdays'&&!days.length){document.getElementById('repeat-note').textContent=trTask('choose_day','Choose at least one weekday.');return;}
  const target=repeatTarget===null?draftRepeat:todos.find(t=>t.id===repeatTarget);if(!target)return;
  target.repeat=mode;target.repeat_days=days;if(target.done&&!target.completed_on&&mode!=='none')target.completed_on=TaskSchedule.today();target.repeat_anchor=TaskSchedule.today();
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  target.due_on=mode==='none'?TaskSchedule.today():TaskSchedule.next(target,yesterday);
  if(repeatTarget!==null){render();save();}else document.getElementById('new-repeat').textContent=recurrenceLabel(target)||trTask('repeat_title','Repeat task');
  document.getElementById('repeat-dialog').close();
}
function setCleanup(enabled){autoCleanup=enabled;pycmd('notion_mini:todo:cleanup:'+(enabled?'1':'0'));save();syncTags();render();}
function maintainTasks(){const normalized=TaskSchedule.normalize(todos,autoCleanup);if(JSON.stringify(normalized)!==JSON.stringify(todos)){todos=normalized;syncTags();render();save();}}
setInterval(maintainTasks,60000);
window.addEventListener('focus',maintainTasks);

let allTags = [];  // distinct tag strings
let sectionOpen = { open: true, done: true };

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function now() {
  return new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

document.getElementById("auto-cleanup").checked=autoCleanup;
// ── Load / Save ───────────────────────────────────
window.loadTodos = function(jsonStr) {
  try {
    const parsed = JSON.parse(jsonStr);
    todos = Array.isArray(parsed) ? TaskSchedule.normalize(parsed,autoCleanup) : [];
  } catch(e) {
    todos = [];
  }
  syncTags();
  render();
};

function save() {
  const normalized=TaskSchedule.normalize(todos,autoCleanup);
  if(JSON.stringify(normalized)!==JSON.stringify(todos)){todos=normalized;syncTags();render();}
  const json = JSON.stringify(todos);
  pycmd('notion_mini:todo:save:' + json);
}

window.__synapseSnapshotForUnload = function() { return JSON.stringify(TaskSchedule.normalize(todos,autoCleanup)); };
window.__synapseSnapshotForVerification = function() { return JSON.stringify(TaskSchedule.normalize(todos,autoCleanup)); };
window.onTodoSaved = function() { showStatus(window.__SYNAPSE_I18N__?.saved || 'Saved'); };
window.onTodoSaveFailed = function() { showStatus(window.__SYNAPSE_I18N__?.save_failed || 'Save failed — your changes are still open.'); };

// ── CRUD ──────────────────────────────────────────
function addTodo() {
  const input = document.getElementById('new-todo-input');
  const tagIn  = document.getElementById('tag-input');
  const text   = input.value.trim();
  if (!text) return;
  const tag    = tagIn.value.trim();
  todos.unshift({ id: uid(), text, done: false, tag, createdAt: now(), ...draftRepeat });
  draftRepeat={repeat:"none"};document.getElementById("new-repeat").textContent=trTask("repeat_title","Repeat task");
  input.value = '';
  tagIn.value = '';
  syncTags();
  render();
  save();
  input.focus();
}

function editTodo(id) {
  const item = todos.find(t => t.id === id);
  if (!item) return;
  const text = prompt(window.__SYNAPSE_I18N__?.edit || 'Edit', item.text);
  if (text === null || !text.trim()) return;
  const tag = prompt(window.__SYNAPSE_I18N__?.tag_placeholder || 'Tag (optional)', item.tag || '');
  if (tag === null) return;
  if (item.text === text.trim() && (item.tag || '') === tag.trim()) return;
  const previousTag = item.tag;
  item.text = text.trim();
  item.tag = tag.trim();
  // Keep the edited task visible when editing from its old tag filter.
  if (selectedTagFilter === previousTag) selectedTagFilter = item.tag || null;
  syncTags();
  render();
  save();
}

window.completeDashboardTasks = function(ids) {
  const wanted = new Set(ids.map(String));
  let changed = false;
  todos.forEach(item => {
    if (wanted.has(String(item.id)) && !item.done) { item.done = true; item.completed_on=TaskSchedule.today(); changed = true; }
  });
  if (changed) { render(); save(); }
};

function toggleDone(id) {
  const item = todos.find(t => t.id === id);
  if (item) {
    const keyboardFocus = document.activeElement?.classList.contains('todo-check');
    item.done = !item.done;
    if(item.done)item.completed_on=TaskSchedule.today();else{delete item.completed_on;item.due_on=TaskSchedule.today();}
    render(); save();
    if (keyboardFocus) {
      const button = document.getElementById('item-' + id)?.querySelector('.todo-check');
      (button || document.querySelector('.todo-check') || document.getElementById('new-todo-input')).focus();
    }
  }
}

function deleteTodo(id) {
  todos = todos.filter(t => t.id !== id);
  syncTags();
  render();
  save();
}

// ── Tags ──────────────────────────────────────────
function syncTags() {
  allTags = [...new Set(todos.map(t => t.tag).filter(Boolean))].sort();
  renderTagChips();
}

let selectedTagFilter = null;

function renderTagChips() {
  const wrap = document.getElementById('tag-chips');
  wrap.innerHTML = '';
  allTags.forEach(tag => {
    const chip = document.createElement('span');
    chip.tabIndex = 0;
    chip.setAttribute('role', 'button');
    chip.setAttribute('aria-pressed', selectedTagFilter === tag ? 'true' : 'false');
    chip.onkeydown = event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault(); event.stopPropagation(); chip.click();
        [...wrap.children].find(el => el.textContent === chip.textContent)?.focus();
      }
    };
    chip.className = 'tag-chip' + (selectedTagFilter === tag ? ' selected' : '');
    chip.appendChild(document.createTextNode(tag));
    const closeGlyph = document.createElement('span');
    closeGlyph.className = 'tag-chip-x';
    closeGlyph.textContent = '✕';
    chip.appendChild(closeGlyph);
    chip.onclick = () => {
      selectedTagFilter = selectedTagFilter === tag ? null : tag;
      renderTagChips();
      render();
    };
    wrap.appendChild(chip);
  });
}

// ── Filter ────────────────────────────────────────
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  render();
}

function visibleTodos() {
  let list = todos;
  if (selectedTagFilter) list = list.filter(t => t.tag === selectedTagFilter);
  if (filter === 'open') list = list.filter(t => !t.done);
  if (filter === 'done') list = list.filter(t =>  t.done);
  return list;
}

// ── Sections ──────────────────────────────────────
function toggleSection(which) {
  sectionOpen[which] = !sectionOpen[which];
  const label = document.querySelector(`#section-${which} .section-label`);
  label.classList.toggle('collapsed', !sectionOpen[which]);
  label.setAttribute('aria-expanded', String(sectionOpen[which]));
  const list  = document.getElementById(`${which}-list`);
  list.style.display = sectionOpen[which] ? '' : 'none';
}

// ── Render ────────────────────────────────────────
function render() {
  const visible = visibleTodos();
  const openItems = visible.filter(t => !t.done);
  const doneItems = visible.filter(t =>  t.done);

  document.getElementById('open-count').textContent = openItems.length;
  document.getElementById('done-count').textContent = doneItems.length;

  document.getElementById('open-list').innerHTML = openItems.map(itemHTML).join('');
  document.getElementById('done-list').innerHTML = doneItems.map(itemHTML).join('');

  // Progress
  const total = todos.length;
  const done  = todos.filter(t => t.done).length;
  const pct   = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progress-bar-fill').style.width = pct + '%';
  const _doneOf = (window.__SYNAPSE_I18N__?.done_of || '{done} / {total} done')
    .replace('{done}', done).replace('{total}', total);
  document.getElementById('progress-label').textContent = _doneOf;

  // Empty state
  const isEmpty = visible.length === 0;
  document.getElementById('empty-state').style.display = isEmpty ? 'flex' : 'none';
  document.getElementById('section-open').style.display =
    (filter === 'done') ? 'none' : '';
  document.getElementById('section-done').style.display =
    (filter === 'open') ? 'none' : '';
}

function itemHTML(t) {
  const doneClass = t.done ? ' done' : '';
  const tagHtml   = t.tag
    ? `<span class="item-tag">${esc(t.tag)}</span>`
    : '';
  const dateHtml  = t.createdAt
    ? `<span class="todo-date">${esc(t.createdAt)}</span>`
    : '';
  return `
  <div class="todo-item${doneClass}" id="item-${t.id}">
    <button type="button" class="todo-check" role="checkbox" aria-checked="${t.done ? 'true' : 'false'}" aria-label="${esc(t.text)}" onclick="toggleDone('${t.id}')">
      <svg viewBox="0 0 12 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 5 4.5 9 11 1"/>
      </svg>
    </button>
    <div class="todo-body">
      <div class="todo-text">${esc(t.text)}</div>
      <div class="todo-meta">${tagHtml}${dateHtml}${recurrenceLabel(t)?`<span class="repeat-badge">↻ ${esc(recurrenceLabel(t))}</span>`:""}</div>
    </div>
    <div class="todo-actions">
      <button class="action-btn repeat-edit" title="${esc(trTask('repeat_title','Repeat task'))}" aria-label="${esc(trTask('repeat_title','Repeat task'))}" onclick="editRepeat('${t.id}')">↻</button>
      <button class="action-btn" title="${esc(window.__SYNAPSE_I18N__?.edit || 'Edit')}" aria-label="${esc(window.__SYNAPSE_I18N__?.edit || 'Edit')}" onclick="editTodo('${t.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m16 3 5 5-13 13H3v-5Z M14 5l5 5"/>
        </svg>
      </button>
      <button class="action-btn del" title="${esc(window.__SYNAPSE_I18N__?.delete || 'Delete')}" aria-label="${esc(window.__SYNAPSE_I18N__?.delete || 'Delete')}" onclick="deleteTodo('${t.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </button>
    </div>
  </div>`;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Status toast ──────────────────────────────────
let _statusTimer = null;
function showStatus(msg) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.classList.add('show');
  clearTimeout(_statusTimer);
  _statusTimer = setTimeout(() => bar.classList.remove('show'), 1800);
}

// ── Night-mode detection ──────────────────────────
// Anki's theme is authoritative (flag/class injected by notebook_sidebar.py);
// prefers-color-scheme is NOT consulted — it follows the OS, not Anki.
if (window.__SYNAPSE_NIGHT__ === true ||
    document.documentElement.classList.contains('nightMode') ||
    document.body.classList.contains('nightMode')) {
  document.body.classList.add('nightMode');
}

// ── Init ─────────────────────────────────────────
render();
if (window.__SYNAPSE_TODO_PRELOAD__ !== undefined) {
  loadTodos(window.__SYNAPSE_TODO_PRELOAD__);
} else {
  pycmd('notion_mini:todo:load');
}
</script>
<script>
// ── SynapsePro i18n: apply data-i18n / data-i18n-placeholder attributes ──
(function applyI18n() {
    const t = window.__SYNAPSE_I18N__;
    if (!t) return;
    document.title = t.title || 'Todo';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key] !== undefined) el.setAttribute('placeholder', t[key]);
    });
})();
</script>

    <script>
    /* ── SynapsePro global error reporter ─────────────────────────────────
       Self-contained (inline styles, no page-CSS dependencies): invisible
       until a JS error occurs, then shows a dismissible banner with the
       real traceback so users can report actionable bugs instead of
       "buttons are not working". Never throws itself. */
    (function() {
        if (window.__spReportError) return;
        function isDark() {
            try {
                if (typeof window.__SYNAPSE_NIGHT__ === 'boolean') return window.__SYNAPSE_NIGHT__;
                if (document.documentElement.classList.contains('nightMode') || document.body.classList.contains('nightMode')) return true;
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) { return false; }
        }
        function ensureBanner() {
            var b = document.getElementById('sp-error-banner');
            if (b) return b;
            if (!document.body) return null;
            var dark = isDark();
            b = document.createElement('div');
            b.id = 'sp-error-banner';
            b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:2147483000;display:none;'
                + 'font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:left;'
                + 'padding:12px 18px;box-shadow:0 -6px 24px rgba(0,0,0,0.25);border-top:2px solid #dc3545;'
                + (dark ? 'background:#2c2c2c;color:#e0e0e0;' : 'background:#ffffff;color:#333333;');
            var btnCss = 'margin-right:8px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;border-radius:7px;'
                + (dark ? 'background:#303030;color:#e0e0e0;border:1px solid #555;' : 'background:#fff;color:#333;border:1px solid #ccc;');
            var preCss = 'display:none;max-height:140px;overflow:auto;white-space:pre-wrap;word-break:break-word;'
                + 'font-size:11px;border-radius:6px;padding:8px;margin:0 0 8px 0;'
                + (dark ? 'background:#404040;border:1px solid #555;' : 'background:#f5f5f5;border:1px solid #ccc;');
            var t = window.__SYNAPSE_I18N__ || {};
            b.innerHTML = '<div style="font-weight:700;color:#dc3545;margin-bottom:4px;">' + (t.error_title || 'Synapse error') + '</div>'
                + '<div class="sp-eb-msg" style="margin-bottom:6px;word-break:break-word;"></div>'
                + '<pre class="sp-eb-pre" style="' + preCss + '"></pre>'
                + '<div><button type="button" data-spact="details" style="' + btnCss + '">' + (t.error_show || 'Show details') + '</button>'
                + '<button type="button" data-spact="copy" style="' + btnCss + '">' + (t.error_copy || 'Copy error') + '</button>'
                + '<button type="button" data-spact="dismiss" style="' + btnCss + '">' + (t.error_dismiss || 'Dismiss') + '</button></div>';
            document.body.appendChild(b);
            b.addEventListener('click', function(e) {
                var act = e.target && e.target.getAttribute && e.target.getAttribute('data-spact');
                if (act === 'dismiss') b.style.display = 'none';
                if (act === 'details') {
                    var pre = b.querySelector('.sp-eb-pre');
                    var open = pre.style.display === 'block';
                    pre.style.display = open ? 'none' : 'block';
                    var t = window.__SYNAPSE_I18N__ || {};
                    e.target.textContent = open ? (t.error_show || 'Show details') : (t.error_hide || 'Hide details');
                }
                if (act === 'copy') {
                    var text = b.querySelector('.sp-eb-msg').textContent + '\n\n' + b.querySelector('.sp-eb-pre').textContent;
                    try { navigator.clipboard.writeText(text); e.target.textContent = (window.__SYNAPSE_I18N__ || {}).error_copied || 'Copied!'; setTimeout(function() { e.target.textContent = (window.__SYNAPSE_I18N__ || {}).error_copy || 'Copy error'; }, 2000); } catch (err) {}
                }
            });
            return b;
        }
        window.__spReportError = function(err, context) {
            try {
                var msg = (err && err.message) ? err.message : String(err);
                var t = window.__SYNAPSE_I18N__ || {};
                var stack = (err && err.stack) ? String(err.stack) : (t.error_no_stack || '(no stack trace available)');
                console.error('[SynapsePro]' + (context ? ' [' + context + ']' : ''), err);
                var show = function() {
                    var b = ensureBanner();
                    if (!b) return;
                    b.querySelector('.sp-eb-msg').textContent = (context ? context + ': ' : '') + msg
                        + ' — ' + (t.error_safe || 'Your data is safe. Please screenshot the details and send them to help.synapse.pro@gmail.com.');
                    b.querySelector('.sp-eb-pre').textContent = stack;
                    b.style.display = 'block';
                };
                if (document.body) show();
                else document.addEventListener('DOMContentLoaded', show);
            } catch (e) { try { console.error('[SynapsePro] error while reporting error', e, err); } catch (e2) {} }
        };
        window.addEventListener('error', function(e) {
            if (e.error && (e.error.message || e.error.stack)) window.__spReportError(e.error, (window.__SYNAPSE_I18N__ || {}).error_unexpected || 'Unexpected error');
            else console.warn('[SynapsePro] Background browser error:', e.message || e);
        });
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.synapseCritical === true) window.__spReportError(e.reason, (window.__SYNAPSE_I18N__ || {}).error_unexpected_async || 'Unexpected error (async)');
            else console.warn('[SynapsePro] Background task rejected:', e.reason);
            e.preventDefault();
        });
    })();
    </script>
